name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact `usb-llms` commands, if you can.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `usb-llms status`
      description: Remove anything private first.
      render: text
  - type: input
    id: version
    attributes:
      label: usb-llms version and OS
      placeholder: 0.1.0 on Ubuntu 24.04 x64
